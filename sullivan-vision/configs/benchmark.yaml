# M1 模型基准配置 (docs/final/15 §4 M1)
# 在可达区间内选最优配置

models:
  - name: yolov8n-seg
    params: 3.4M
  - name: yolov8s-seg
    params: 11.8M

precision:
  - fp16
  - fp32

resolutions:
  - width: 640
    height: 480
  - width: 800
    height: 600

device: cuda

target_p95_ms: 150  # FR-07 服务端单帧推理 P95 上限
target_classes:
  - person
  - vehicle
  - step
  - roadblock
  - ramp
  - pillar
