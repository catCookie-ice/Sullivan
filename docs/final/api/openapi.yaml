# SullivanMINI OpenAPI 契约
# 文档版本: v0.1 (骨架草案)
# 当前状态: Java 业务 API 与 Python 导航 API 的契约骨架，按阶段增量补充。

openapi: "3.1.0"
info:
  title: SullivanMINI API
  version: "0.1.0"
  description: Java 业务应用 REST API；导航路径由 Python 应用直接提供 (docs/final/06)

servers:
  - url: http://localhost:8080/api/v1
    description: Java 业务应用

paths:
  # ============ 身份与账号 (FR-01~FR-03) ============
  # 注册请求体均支持可选字段 recoveryPhone / recoveryEmail（找回联系方式，半加密存储）；
  # 留空不影响注册，但密码将无法通过手机号/邮箱找回。
  /auth/register:
    post:
      tags: [Auth]
      summary: 监护人或志愿者注册（可选 recoveryPhone/recoveryEmail）
  /auth/register/organization:
    post:
      tags: [Auth]
      summary: 公益机构注册（可选 recoveryPhone/recoveryEmail）
  /auth/register/admin:
    post:
      tags: [Auth]
      summary: 使用注册码注册管理员
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录（响应 TokenResponse 含 recoveryReminder：未设置找回联系方式时提醒设置）
  /auth/password-recovery/start:
    post:
      tags: [Auth]
      summary: 开始找回密码：返回可用找回方式与不加密前缀（公开）
  /auth/password-recovery/verify:
    post:
      tags: [Auth]
      summary: 补全联系方式并验证（公开；发送验证码与后续重置留空）
  /auth/me/recovery:
    get:
      tags: [Auth]
      summary: 查看我的找回联系方式状态（已登录）
    put:
      tags: [Auth]
      summary: 设置或更新我的找回联系方式（recoveryPhone/recoveryEmail 至少一个）
  /auth/me/recovery/remind-later:
    post:
      tags: [Auth]
      summary: 提醒“下次再说”：一周后再提醒（已登录）
  /auth/me/recovery/dismiss:
    post:
      tags: [Auth]
      summary: 不再提醒（已登录）
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新令牌
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录

  /users/profile:
    get:
      tags: [Profile]
      summary: 获取个人资料
    put:
      tags: [Profile]
      summary: 修改个人资料
  /users/{userId}:
    get:
      tags: [Lookup]
      summary: 按唯一标识查找自然人（志愿者/监护人/受护人）
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
  /organizations/{organizationId}:
    get:
      tags: [Lookup]
      summary: 按唯一标识查找公益机构
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
  /admins/{adminId}:
    get:
      tags: [Lookup]
      summary: 按唯一标识查找管理员（需 ADMIN_MANAGE 权限）

  # ============ 监护绑定 (FR-04~FR-05)，双向（发起方+接收方同意） ============
  # 发起方 recorded in requested_by；接收方（非发起方）确认/拒绝，发起方取消，任一方解除（永久绑定除外）。
  /bindings:
    get:
      tags: [Binding]
      summary: 我的绑定与请求列表（作为监护人或受护人参与的全部关系）
    post:
      tags: [Binding]
      summary: 发起绑定（targetRole=PROTECTEE 需调用者 GUARDIAN；targetRole=GUARDIAN 需调用者 PROTECTEE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, targetRole]
              properties:
                targetId: { type: string, description: 目标账号 ID }
                targetRole: { type: string, enum: [GUARDIAN, PROTECTEE] }
  /bindings/{id}/accept:
    post:
      tags: [Binding]
      summary: 接收方确认绑定
  /bindings/{id}/reject:
    post:
      tags: [Binding]
      summary: 接收方拒绝绑定（reason 可选）
  /bindings/{id}/cancel:
    post:
      tags: [Binding]
      summary: 发起方取消 PENDING 请求
  /bindings/{id}/terminate:
    post:
      tags: [Binding]
      summary: 任一方解除生效绑定（permanent=true 返回 403）
  # ============ 二维码扫码绑定与扫码登录 ============
  # 状态机见 docs/final/02 §4.4 / §4.5；表见 docs/final/05 §2 与 db/schema.sql 的 V6 段。
  # 两个扫码交互都只在 Android 端提供（出示端与扫描端）。
  #
  # 绑定码：受护人登录后出示；监护人扫码即完成绑定，记为「受护人发起 + 监护人扫码确认」，
  # 不新增绑定状态转换（落在 PENDING -> ACTIVE 之内）。
  /qr/bind-codes:
    post:
      tags: [QR]
      summary: 受护人签发绑定码（需受护人令牌；同受护人旧码置 REVOKED）
  /qr/bind-codes/current:
    get:
      tags: [QR]
      summary: 取当前有效绑定码，无则 data 为 null（需受护人令牌）
  /qr/bind-codes/scan:
    post:
      tags: [QR]
      summary: 监护人扫码建立绑定（需监护人令牌；重复扫幂等；已有监护人发起的 PENDING 返回 409）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 二维码里的 12 位绑定码 }
  # 登录票据：受护人未登录时在登录页出示；监护人扫码、选择自己已绑定的受护人并确认后，
  # 由出示设备用一次性凭据换取该受护人的令牌。令牌不出现在任何轮询响应里。
  /qr/login-tickets:
    post:
      tags: [QR]
      summary: 公开：创建登录票据（只上传 clientSecret 的 SHA-256，明文留在出示设备上）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secretHash]
              properties:
                secretHash: { type: string, pattern: '^[0-9a-f]{64}$', description: clientSecret 的小写十六进制 SHA-256 }
  /qr/login-tickets/{ticket}:
    get:
      tags: [QR]
      summary: 公开：轮询票据状态（只返回状态；CONFIRMED 时返回 exchangeCode；绝不返回 accessToken）
      parameters:
        - name: ticket
          in: path
          required: true
          schema: { type: string }
  /qr/login-tickets/{ticket}/exchange:
    post:
      tags: [QR]
      summary: 公开：一次性兑换令牌（clientSecret 与 exchangeCode 必须同时匹配；成功后票据 CONSUMED）
      parameters:
        - name: ticket
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSecret, exchangeCode]
              properties:
                clientSecret: { type: string }
                exchangeCode: { type: string }
  /qr/login-tickets/{ticket}/scan:
    post:
      tags: [QR]
      summary: 监护人扫描登录码（需监护人令牌；他人抢扫返回 409），返回该监护人 ACTIVE 绑定的受护人候选
      parameters:
        - name: ticket
          in: path
          required: true
          schema: { type: string }
  /qr/login-tickets/{ticket}/confirm:
    post:
      tags: [QR]
      summary: 监护人确认授权某受护人登录（服务端复核 ACTIVE 绑定，未绑定返回 403；幂等）
      parameters:
        - name: ticket
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protecteeId]
              properties:
                protecteeId: { type: string, description: 监护人选定并授权的受护人账号 ID }

  # 旧路径兼容别名（新前端请使用 /bindings）
  /guardians/protectees:
    post:
      tags: [Binding]
      summary: 监护人创建受护人并建立永久初始绑定
  /guardians/bindings:
    post:
      tags: [Binding]
      summary: '[DEPRECATED] 监护人发起绑定（等效 POST /bindings {targetRole=PROTECTEE}）'
      deprecated: true
  /guardians/bindings/{id}/accept:
    post:
      tags: [Binding]
      summary: '[DEPRECATED] 确认绑定（等效 POST /bindings/{id}/accept）'
      deprecated: true

  # ============ 志愿者兼任申请 (FR-02B) ============
  /users/me/roles/volunteer:
    post:
      tags: [Auth]
      summary: 提交志愿者兼任申请（需管理员审核，注册满配置天数，返回 PENDING 申请）
    get:
      tags: [Auth]
      summary: 我的志愿者兼任申请列表
  /users/me/roles/volunteer/cancel/{applicationId}:
    post:
      tags: [Auth]
      summary: 撤销我的 PENDING 申请

  # ============ 志愿者兼任审核 (FR-22 补充) ============
  /admin/volunteer-applications:
    get:
      tags: [Admin]
      summary: 志愿者兼任申请列表（需 VOLUNTEER_REVIEW；含申请人注册时间）
  /admin/volunteer-applications/{id}/approve:
    post:
      tags: [Admin]
      summary: 审核通过（事务内追加 VOLUNTEER 角色，二次校验注册时长）
  /admin/volunteer-applications/{id}/reject:
    post:
      tags: [Admin]
      summary: 审核拒绝（拒绝原因必填）

  # ============ 位置 (FR-06) ============
  /guardians/locations/{protecteeUid}:
    get:
      tags: [Location]
      summary: 查询已绑定受护人位置

  # ============ 导航 (FR-07~FR-08) ============
  /navigation/sessions:
    post:
      tags: [Navigation]
      summary: 创建导航会话
      servers:
        - url: http://localhost:8000/api/v1
          description: Python 导航应用
  /navigation/sessions/{id}/stop:
    post:
      tags: [Navigation]
      summary: 停止导航会话
      servers:
        - url: http://localhost:8000/api/v1
          description: Python 导航应用

  # ============ 报警 (FR-11~FR-13) ============
  /alerts:
    post:
      tags: [Alert]
      summary: 创建报警
    get:
      tags: [Alert]
      summary: 查询我的报警
  /alerts/{id}:
    get:
      tags: [Alert]
      summary: 报警详情
  /alerts/{id}/acknowledge:
    post:
      tags: [Alert]
      summary: 确认收到报警
  /alerts/{id}/resolve:
    post:
      tags: [Alert]
      summary: 解决报警

  # ============ 通知 (FR-14) ============
  /notifications:
    get:
      tags: [Notification]
      summary: 通知列表
  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: 未读数
  /notifications/{id}/read:
    post:
      tags: [Notification]
      summary: 标记已读

  # ============ 公益机构 (FR-15) ============
  /organizations/register:
    post:
      tags: [Organization]
      summary: 机构注册
  /organizations/profile:
    get:
      tags: [Organization]
      summary: 机构资料
    put:
      tags: [Organization]
      summary: 修改资料

  # ============ 公益服务 (FR-16~FR-18) ============
  /services:
    post:
      tags: [Service]
      summary: 创建服务项目
  /services/public:
    get:
      tags: [Service]
      summary: 公开项目列表
  /services/my:
    get:
      tags: [Service]
      summary: 我的服务项目
  /services/{id}/pause:
    post:
      tags: [Service]
      summary: 暂停项目
  /services/{id}/open:
    post:
      tags: [Service]
      summary: 重新开放项目
  /services/{id}/close:
    post:
      tags: [Service]
      summary: 永久关闭项目

  /applications:
    post:
      tags: [Application]
      summary: 提交服务申请
  /applications/{id}/approve:
    post:
      tags: [Application]
      summary: 批准申请
  /applications/{id}/reject:
    post:
      tags: [Application]
      summary: 拒绝申请
  /applications/{id}/complete:
    post:
      tags: [Application]
      summary: 完成服务
  /applications/{id}/cancel:
    post:
      tags: [Application]
      summary: 取消申请

  # ============ 志愿活动 (FR-19~FR-20) ============
  /activities:
    post:
      tags: [Activity]
      summary: 机构创建活动（活动名/地点含经纬度/开始结束/报名窗口/人数；机构须 APPROVED）
    get:
      tags: [Activity]
      summary: 公开活动列表（默认只出 RECRUITING，不含报名者清单）
  /activities/mine:
    get:
      tags: [Activity]
      summary: 我的活动列表（机构归属强制为令牌主体）
  /activities/{id}/cancel:
    post:
      tags: [Activity]
      summary: 取消活动

  # ============ 实时会话 / 长连接 (FR-25) ============
  # 长连接本体在 WebSocket 端点 /ws/realtime（握手带 ?token=<jwt>&sessionId=<id>），
  # 会话创建与消息中继都要求双方存在 ACTIVE 绑定；sessionType 当前仅 BASIC。
  /realtime/sessions:
    post:
      tags: [Realtime]
      summary: 发起实时会话（REQUESTED；双方须有 ACTIVE 绑定）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUid, sessionType]
              properties:
                targetUid: { type: string, description: 已绑定受护人/监护人 ID }
                sessionType: { type: string, enum: [BASIC] }
    get:
      tags: [Realtime]
      summary: 我的会话列表（发起或接收）
  /realtime/sessions/{id}/accept:
    post:
      tags: [Realtime]
      summary: 接收方接受会话（REQUESTED → ACTIVE）
  /realtime/sessions/{id}/reject:
    post:
      tags: [Realtime]
      summary: 接收方拒绝会话（reason 可选）
  /realtime/sessions/{id}/end:
    post:
      tags: [Realtime]
      summary: 任一方结束会话

  # ============ 报警与位置 (FR-06 / FR-11~FR-13) ============
  /me/location:
    put:
      tags: [Alert]
      summary: 上报最新位置（覆盖式，只保留最新一条）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, format: double, minimum: -90, maximum: 90 }
                longitude: { type: number, format: double, minimum: -180, maximum: 180 }
                accuracyM: { type: number, format: double, minimum: 0, description: 定位精度（米） }
                capturedAt: { type: string, format: date-time, description: 设备采集时刻；缺省按服务端收到时刻计 }
    get:
      tags: [Alert]
      summary: 读取我的最新位置（从未上报过时 404）
  /alerts:
    post:
      tags: [Alert]
      summary: 创建报警（先落库再路由；存在生效监护人时通知全部监护人）
      description: |
        路由规则见 00 §5。报警创建时固化位置快照，并按 alert_setting 的
        配置在 5 秒后（默认；用户可关闭）按绑定确认时间**依次**向全部 ACTIVE 监护人
        发起实时会话。同一 (protecteeUid, idempotencyKey) 重复提交返回已有报警。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertType, idempotencyKey]
              properties:
                alertType: { type: string, enum: [MANUAL, VOICE_HELP, COLLISION] }
                idempotencyKey: { type: string, maxLength: 100, description: 同一次报警的多次提交必须复用 }
                note: { type: string, maxLength: 300 }
    get:
      tags: [Alert]
      summary: 我的报警列表（受护人视角，倒序）
  /alerts/{id}:
    get:
      tags: [Alert]
      summary: 报警详情（仅受护人本人与其生效监护人；其他人一律 404）
  /alerts/{id}/resolve:
    post:
      tags: [Alert]
      summary: 结束报警（仅受护人本人；同时取消尚未执行的自动呼叫）
  /me/alert-setting:
    get:
      tags: [Alert]
      summary: 读取报警偏好（从未配置过时返回默认值：开启、5 秒）
    put:
      tags: [Alert]
      summary: 修改报警偏好（关闭时一并取消已排期但尚未执行的自动呼叫）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoSessionEnabled]
              properties:
                autoSessionEnabled: { type: boolean }
  /me/alert-guardians:
    get:
      tags: [Alert]
      summary: 报警会依次通知谁（按将要呼叫的顺序返回生效监护人 ID）

  /enrollments/{activityId}:
    post:
      tags: [Enrollment]
      summary: 报名活动
  /enrollments/{id}/approve:
    post:
      tags: [Enrollment]
      summary: 审核通过
  /enrollments/{id}/reject:
    post:
      tags: [Enrollment]
      summary: 审核拒绝
  /enrollments/{id}/cancel:
    post:
      tags: [Enrollment]
      summary: 取消报名

  # ============ 管理员 (FR-22~FR-24) ============
  /admin/users:
    get:
      tags: [Admin]
      summary: 用户列表（监护人/受护人/志愿者；志愿者列表含兼任志愿者的监护人）
  /admin/users/{userId}:
    delete:
      tags: [Admin]
      summary: 删除用户（逻辑删除；兼任志愿者仅取消其志愿者兼任）
  /admin/organizations:
    get:
      tags: [Admin]
      summary: 机构列表（按状态过滤）
  /admin/organizations/{organizationId}:
    delete:
      tags: [Admin]
      summary: 删除机构（逻辑删除）
  /admin/registration-codes:
    post:
      tags: [Admin]
      summary: 最高管理员或 HR 管理员创建注册码
  /admin/accounts:
    post:
      tags: [Admin]
      summary: 创建管理员
  /admin/organizations/pending:
    get:
      tags: [Admin]
      summary: 待审核机构列表
  /admin/organizations/{id}/review:
    post:
      tags: [Admin]
      summary: 审核机构
  /admin/users/{id}/disable:
    post:
      tags: [Admin]
      summary: 禁用用户
  /admin/users/{id}/enable:
    post:
      tags: [Admin]
      summary: 启用用户
  /admin/stats/overview:
    get:
      tags: [Admin]
      summary: 运营概览
