# Project-wide Gradle settings.

# 使用 AndroidX（工程声明了 AndroidX 依赖，缺这一项会直接构建失败）
android.useAndroidX=true

# 本工程路径含中文（用户名目录「陈聪」），AGP 默认会拒绝构建。
# 打开这个开关跳过路径检查；如果后续遇到资源或 NDK 相关的诡异问题，
# 优先考虑把工程挪到纯 ASCII 路径下。
android.overridePathCheck=true

# 这里的 -Dfile.encoding 必须是平台默认编码（本机中文 Windows = GBK），不能写 UTF-8。
#
# 原因：本机 sun.jnu.encoding=GBK，JVM 读 @argfile 时按平台编码解码；而 Gradle 写 argfile
# 用的是它自己的默认编码。测试 classpath 较长时 Gradle 改用 @argfile 传参，若 daemon 写
# UTF-8、worker 按 GBK 读，含中文路径的 classpath 条目就会被解成乱码，报
#   ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain
# （已实测确认：同一份 argfile 用 UTF-8 写必失败、用 GBK 写正常。）
# assembleDebug 不受影响——编译在 daemon 内完成，不 fork worker。
#
# 源码编码不受此影响：下面 app/build.gradle.kts 里 compileOptions.encoding 显式指定了 UTF-8。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK

# 后端基地址。**构建期常量**，由 app/build.gradle.kts 注入 BuildConfig.SERVER_BASE_URL。
#
# 为什么不是运行时设置：地址是**部署事实**，不是用户偏好。此前它在两处做成输入框，
# 结果是「这台设备连的是哪台服务器」由使用现场决定 —— 而需要填它的只有帮忙部署的人，
# 受护人端按既定口径又没有账密登录、没人替它填对，于是真机首次安装必然撞上
# 出厂默认值 10.0.2.2（模拟器专用的宿主别名，真机上无此路由），
# 现场表现是「生成登录码失败：网络连接失败」。详见 17-开发日记-2026-10-16 §8。
#
# ⚠ 必须配。**刻意不给默认值**：这里留一个"看起来能用"的地址（比如写个
#    192.168.1.x）比留空更坏——忘了改就会静默连向别处，或者又变成一句
#    说不清的「网络连接失败」（正是本次修掉的那类问题）。
#    留空则会在 App 第一次取地址时抛一条说明白缺什么的异常（SessionStore.baseUrl()），
#    失败了自己说清楚。取值走 Gradle 属性，命令行 -PserverBaseUrl=… 也能覆盖。
#    结尾的 /api/v1/ 不能少（Retrofit baseUrl 约定），8642 是服务端默认端口。
#    本机地址用 ipconfig 看**与手机同网段**那块适配器的 IPv4。
#    真实值**不要写在这里**（本文件入库，内网地址与网段属于环境信息）；
#    写到 `local.properties`（已被 .gitignore 排除），构建脚本会读它：
#        serverBaseUrl=http://192.168.x.x:8642/api/v1/
#    换网络后地址会变，需同步改 local.properties 并重新出包。
#serverBaseUrl=http://192.168.x.x:8642/api/v1/

# 告诉 Gradle 本机的 JDK 17 装在哪，配合 gradle/gradle-daemon-jvm.properties 使用。
#
# 作用：Android Studio 默认拿它自带的 JBR 25 去跑 Gradle，而 Gradle 8.9 跑不了 JDK 25
# （只支持到 Java 22）、AGP 8.5.2 也不支持。有了这两项，不管 IDE 里 Gradle JDK 选的是哪个，
# Gradle 都会自己找到并改用 JDK 17 起守护进程 —— 不需要手动去 IDE 设置里改 JDK。
#
# ⚠ 这一行是**本机专用**的绝对路径。换机器/换人时请改成那台机器上 JDK 17 的实际位置；
#    路径不存在时 Gradle 会直接报 "Cannot find a Java installation ... Compatible with Java 17"
#    而**不是**静默退化，所以务必改对。
#    盘符后的冒号要写成 "\:"——properties 文件里冒号是键值分隔符，不转义会被 lint 判错，
#    且转义后 Gradle 读到的仍是普通的 "C:/..."。
org.gradle.java.installations.paths=C\:/Program Files/Java/jdk-17.0.10
