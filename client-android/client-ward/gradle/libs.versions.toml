[versions]
agp = "8.13.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
# 高德定位 SDK。com.amap.api:location 没有 10.x 版本（10.0.0 是 com.amap.api:3dmap 的号段，
# 此前写的 10.0.0 从未解析成功过），当前 release 为 11.3.000。
amap = "11.3.000"

# 受护人端侧障碍检测（移植自「参考1」）。版本照搬参考1 已在真机验证过的组合：
# camera 必须留在 1.4.x —— 1.5.x 需要 compileSdk 36 / AGP 8.9+，会连带撬动整条工具链。
appcompat = "1.6.1"
material = "1.10.0"
camerax = "1.4.1"
onnxruntime = "1.20.0"
annotation = "1.8.0"
junit = "4.13.2"
# 二维码生成 + 解码。选 core 而不是 zxing-android-embedded：
# core 是纯 Java、零 GMS 依赖（国内设备可用），且不含那个难以做无障碍定制的 CaptureActivity；
# BitMatrix → Bitmap 的那二十行桥接代码自己写。3.5.3 是 3.5.x 线最后一个 release。
zxing = "3.5.3"

[libraries]
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
amap-location = { group = "com.amap.api", name = "location", version.ref = "amap" }

# 端侧检测
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
