spring.application.name=server-java
# 本地 .env 文件（不入库）可通过环境变量覆盖下方默认值，模板见 .env.example
spring.config.import=optional:file:.env[.properties]

# ============ Web 服务端口 ============
# 服务端口在此处指定：默认 8080。
# 临时换端口可改本行的 8080，也可在 .env 中设置 SERVER_PORT 覆盖（完整示例见 application.example.properties）。
server.port=${SERVER_PORT:8642}

# ============ 运行环境 ============
# 环境变量 APP_ENV 区分开发（dev）与生产（prod），默认 dev。
# dev 环境额外提供 GET /dev/routes 列出全部已注册路由；生产环境不注册该接口。
app.env=${APP_ENV:dev}

# ============ 数据库（MySQL） ============
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sullivan?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ Flyway 数据库迁移 ============
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ============ Redis（管理员注册码缓存与原子核销） ============
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
# 逻辑删除：deletedAt（LocalDateTime，@TableLogic）字段。删除时写入 now()，查询自动过滤 deleted_at IS NULL。
mybatis-plus.global-config.db-config.logic-delete-field=deletedAt
mybatis-plus.global-config.db-config.logic-delete-value=now()
mybatis-plus.global-config.db-config.logic-not-delete-value=null

# ============ Actuator 监控 ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============ JWT 认证 ============
app.jwt.secret=${JWT_SECRET:change_me_to_a_long_random_string_at_least_32_bytes}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:1800}

# ============ 二维码（扫码绑定 / 扫码授权登录） ============
# 绑定码与登录票据的有效期（秒）。两者都很短：绑定码展示在受护人屏幕上，越短窗口越小；
# 登录票据由出示方轮询，两分钟足够监护人完成扫码与选人。
app.qr.bind-code-ttl-seconds=${QR_BIND_CODE_TTL_SECONDS:120}
app.qr.login-ticket-ttl-seconds=${QR_LOGIN_TICKET_TTL_SECONDS:120}

# ============ 志愿者兼任申请 ============
# 注册满 N 天（默认 90 天 = 3 个月）才可申请/审核通过；提交与审核两处校验。
app.volunteer.min-registration-days=${VOLUNTEER_MIN_REGISTRATION_DAYS:90}

# ============ 高德逆地理编码（报警坐标 → 地名） ============
# 需要「Web 服务」类型的 Key（restapi.amap.com），与客户端在用的「Android 平台」Key
# 不是同一种，要在高德控制台单独创建。留空 = 功能关闭，不发起任何外部请求；
# 报警链路不受影响，只是报警里的位置没有地名，客户端回落到坐标展示。
app.amap.web-key=${AMAP_WEB_KEY:}
# 解析硬时限（毫秒）：到点没结果就带 pending 标识直接转发报警，绝不让地名拖慢求助。
# 客户端见到 pending 会用自己的 Android Key 本端解析兜底。0 = 不限时（不推荐）。
app.amap.geocode-deadline-ms=${AMAP_GEOCODE_DEADLINE_MS:1000}

# ============ 启动初始化（首次启动自动创建最高管理员） ============
app.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME:初始最高管理员}

# ============ WebRTC 语音/视频/摄像头会话（00 §8.1 基线变更） ============
# STUN 用于打洞；TURN 用于打洞失败时中转。**没有 TURN 时两端不在同一网段就接不通**，
# 客户端会把这件事如实告诉用户（见 01 §4），不会显示「已接通」。
# 本地演示只填 STUN 即可；跨网络必须配 TURN。
app.webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
app.webrtc.turn-urls=${WEBRTC_TURN_URLS:}
# coturn 的 static-auth-secret。**不要把它下发给客户端**：客户端拿到的是
# 用它算出的、带过期时间的临时凭据（见 IceServerService）。
app.webrtc.turn-secret=${WEBRTC_TURN_SECRET:}
app.webrtc.credential-ttl-seconds=${WEBRTC_CREDENTIAL_TTL_SECONDS:3600}

# ============ 语音留言 ============
# 单条上限：默认 60 秒 / 1 MB / 24 小时 50 条。
app.voice-message.max-duration-ms=${VOICE_MESSAGE_MAX_DURATION_MS:60000}
app.voice-message.max-size-bytes=${VOICE_MESSAGE_MAX_SIZE_BYTES:1048576}
app.voice-message.max-per-day=${VOICE_MESSAGE_MAX_PER_DAY:50}

# ============ 媒体对象存储 ============
# filesystem 为开发默认（不必先起 MinIO，也不会把测试数据写进云桶）。
# 部署用 cos（腾讯云对象存储）；也可用自建 minio。
# 取值：filesystem | cos | minio
app.media.store=${MEDIA_STORE:filesystem}
app.media.root=${MEDIA_ROOT:./data/media}

# ---- 腾讯云 COS（app.media.store=cos）----
# 桶必须是**私有**的：对象键一旦泄露（日志/报错/截图）就等同文件泄露，
# 这里所有鉴权的前提正是「桶不公开」。
# bucket 必须带 APPID 后缀，形如 sullivan-1250000000；只写 sullivan 会连不上，
# 且报错看起来像权限问题，容易被带偏 —— 启动时会直接拦住。
# prefix 用于把不同环境的数据隔在同一个桶里（如 sullivan-test、sullivan-prod），
# 留空则直接写在桶根下。
app.media.cos.secret-id=${COS_SECRET_ID:}
app.media.cos.secret-key=${COS_SECRET_KEY:}
app.media.cos.region=${COS_REGION:}
app.media.cos.bucket=${COS_BUCKET:}
app.media.cos.prefix=${COS_PREFIX:}

# ---- 自建 MinIO（app.media.store=minio）----
app.media.minio.endpoint=${MINIO_ENDPOINT:}
app.media.minio.access-key=${MINIO_ROOT_USER:}
app.media.minio.secret-key=${MINIO_ROOT_PASSWORD:}
app.media.minio.bucket=${MINIO_BUCKET:sullivan-media}
