# =====================================================================
# SullivanMINI 业务后端 — 完整配置示例（参考模板，提交入库，不会被自动加载）
# =====================================================================
#
# 说明：
#   1. 实际生效的配置在 application.properties 中，其默认值可直接启动。
#   2. 本文件列出全部可配置项的中文说明与示例，供复制或参考。
#   3. 需要按环境覆盖的值（数据库密码、JWT 密钥等）请放入本地 .env 文件
#      （.env 不入库，模板见同目录 .env.example）。
#
# 覆盖规则：application.properties 中的 ${VAR:default} 表示优先取环境变量 VAR，
# 未设置时使用冒号后的默认值。

# ---------------- Web 服务 ----------------
# 服务端口：在此配置文件中指定，默认 8080；也可用环境变量 SERVER_PORT 覆盖。
server.port=${SERVER_PORT:8080}
# 应用名（日志/监控标识）
spring.application.name=server-java
# 加载本地 .env 文件中的环境变量（文件缺失时不报错）
spring.config.import=optional:file:.env[.properties]

# ---------------- 运行环境与开发调试 ----------------
# 环境变量 APP_ENV 区分开发（dev）与生产（prod），默认 dev。
#   dev  ：额外提供 GET /dev/routes 列出全部已注册路由（开发调试用），启动横幅提示该地址；
#   prod ：不注册 /dev/routes 调试接口。
app.env=${APP_ENV:dev}

# ---------------- 数据库（MySQL 8.x 兼容） ----------------
# JDBC 连接串；启用 UTF-8 中文、UTC 时区，关闭 SSL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sullivan?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- Flyway 数据库迁移 ----------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ---------------- MyBatis-Plus ----------------
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
# 逻辑删除：deletedAt（LocalDateTime，@TableLogic）字段。删除时写入 now()，查询自动过滤 deleted_at IS NULL。
mybatis-plus.global-config.db-config.logic-delete-field=deletedAt
mybatis-plus.global-config.db-config.logic-delete-value=now()
mybatis-plus.global-config.db-config.logic-not-delete-value=null

# ---------------- Actuator 监控 ----------------
# 对外暴露 /actuator/health 与 /actuator/info，健康详情不对外显示
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------- JWT 认证 ----------------
# 令牌签名密钥（生产环境必须替换为 ≥32 字节随机串）
app.jwt.secret=${JWT_SECRET:change_me_to_a_long_random_string_at_least_32_bytes}
# 访问令牌有效期（秒），默认 1800 秒 = 30 分钟
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:1800}

# ---------------- 启动初始化（首次启动自动创建最高管理员） ----------------
# 首次启动若数据库没有启用的 SUPER_ADMIN，将用以下三项创建
app.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME:初始最高管理员}

# ---------------- 志愿者兼任申请 ----------------
# 注册满 N 天（默认 90 天 = 3 个月）才可申请/审核通过；提交与审核两处校验。
app.volunteer.min-registration-days=${VOLUNTEER_MIN_REGISTRATION_DAYS:90}

# ---------------- WebRTC 语音/视频/摄像头会话 ----------------
# STUN 打洞；TURN 在打洞失败时中转。没有 TURN 时两端不在同一网段就接不通，
# 客户端会如实提示，不会显示“已接通”。
app.webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
app.webrtc.turn-urls=${WEBRTC_TURN_URLS:}
# coturn 的 static-auth-secret，**不要下发给客户端**（客户端拿到的是临时凭据）
app.webrtc.turn-secret=${WEBRTC_TURN_SECRET:}
app.webrtc.credential-ttl-seconds=${WEBRTC_CREDENTIAL_TTL_SECONDS:3600}

# ---------------- 语音留言 ----------------
# 单条上限：默认 60 秒 / 1 MB / 每 24 小时 50 条
app.voice-message.max-duration-ms=${VOICE_MESSAGE_MAX_DURATION_MS:60000}
app.voice-message.max-size-bytes=${VOICE_MESSAGE_MAX_SIZE_BYTES:1048576}
app.voice-message.max-per-day=${VOICE_MESSAGE_MAX_PER_DAY:50}

# ---------------- 媒体对象存储 ----------------
# 取值：filesystem（开发默认）| cos（腾讯云，部署用）| minio（自建）
app.media.store=${MEDIA_STORE:filesystem}
app.media.root=${MEDIA_ROOT:./data/media}

# 腾讯云 COS（app.media.store=cos）
# 桶必须**私有**；bucket 必须带 APPID 后缀（如 sullivan-1250000000），
# 只写前半段时 SDK 报“桶不存在”，看着像权限问题，实际是名字少了一半。
app.media.cos.secret-id=${COS_SECRET_ID:}
app.media.cos.secret-key=${COS_SECRET_KEY:}
app.media.cos.region=${COS_REGION:}
app.media.cos.bucket=${COS_BUCKET:}
app.media.cos.prefix=${COS_PREFIX:}

# 自建 MinIO（app.media.store=minio）
app.media.minio.endpoint=${MINIO_ENDPOINT:}
app.media.minio.access-key=${MINIO_ROOT_USER:}
app.media.minio.secret-key=${MINIO_ROOT_PASSWORD:}
app.media.minio.bucket=${MINIO_BUCKET:sullivan-media}

# ---------------- OpenAPI 接口文档（springdoc） ----------------
# 启动后地址（端口取上方 server.port）：
#   Swagger UI    http://localhost:<server.port>/swagger-ui/index.html
#   OpenAPI JSON  http://localhost:<server.port>/v3/api-docs
# 以下为可选的 springdoc 调整项，按需放开并修改（默认即可，无需配置）：
# springdoc.api-docs.path=/v3/api-docs
# springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.swagger-ui.tags-sorter=alpha
# springdoc.swagger-ui.operations-sorter=method
